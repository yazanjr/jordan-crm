<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMG CRM — Quotation editor</title>
<link rel="stylesheet" href="styles/tokens.css">
<style>
  /* Standalone editor (no sidebar) — scroll the whole document.
     Overrides tokens.css's app-shell defaults (body{overflow:hidden}, height:100%). */
  html, body { height: auto; min-height: 100%; }
  body { background: var(--bg-page); margin: 0; font-family: var(--font-sans, system-ui); overflow-y: auto; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--neutral-200); border-radius: 5px; border: 2px solid var(--bg-page); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

</html>
